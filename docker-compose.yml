version: '3.8'

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx_reverse_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTBOT_WWW}:/var/www/certbot:ro
      - ${CERTBOT_CONF_NGINX}:/etc/nginx/ssl:ro
    networks:
      - web
    depends_on:
      - certbot

  db:
    image: mariadb:10.6
    container_name: mariadb_cointainer
    networks:
      - web
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: BrieucGorin
      MARIADB_DATABASE: cashtagdb
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - /home/debian/var-lib-mysql/:/var/lib/mysql

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ${CERTBOT_WWW}:/var/www/certbot:rw
      - ${CERTBOT_CONF_NGINX}:/etc/letsencrypt:rw
    networks:
      - web

networks:
  web:
    external: true